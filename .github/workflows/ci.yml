name: CI

# Docs-only changes build nothing.
on:
  push:
    branches: [main, beta]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  workflow_dispatch:
  # Weekly on main: Fedora's updates, and a fresh dev image (the image job).
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

# A newer push cancels a branch's or PR's run, but not main's: its runs are
# the release check, and the image job must not stop between its pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# Every action and reusable workflow is pinned by commit. atlas-framework's
# app checks are at the commit of the release tag Cargo.toml pins the crates
# to; the framework job checks that they agree.
jobs:
  # The CI dev image (ci/Containerfile), rebuilt from main only, when the
  # Containerfile, the spec or the week changed. The only job that may write
  # packages; GITHUB_TOKEN is used at run time only, nothing goes in the image.
  image:
    name: Dev image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, check and push it when it changed
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          image=ghcr.io/eternalcoder454/atlas-archive-dev
          stamp=f44-$(cat ci/Containerfile packaging/atlas-archive.spec packaging/rpmfusion-nonfree.sh | sha256sum | cut -c1-16)-$(date -u +%G-%V)
          digest() {
            local d
            d=$(docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}') || return 1
            [[ $d =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
            printf '%s\n' "$d"
          }
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # Built already (this week, from these files): :f44 must be it.
          # It may not be after a run cancelled between the two pushes, or
          # when the files went back to an earlier state this week.
          if built=$(digest "$image:$stamp" 2>/dev/null); then
            if [ "$(digest "$image:f44" 2>/dev/null || true)" != "$built" ]; then
              docker buildx imagetools create -t "$image:f44" "$image@$built"
              echo "$image:f44 moved to $image:$stamp"
            else
              echo "$image:$stamp is current"
            fi
            exit 0
          fi
          docker build --pull -f ci/Containerfile -t "$image:$stamp" -t "$image:f44" packaging
          # It is public: no GitHub token, and no build argument or environment
          # variable that names one, may be in it. Each output is taken first,
          # so a failing docker command fails the step instead of passing.
          history=$(docker history --no-trunc --format '{{.CreatedBy}}' "$image:$stamp")
          if grep -iE 'token|secret|password|gh[opsur]_|github_pat_' <<<"$history"; then
            echo "::error::the image's history mentions a secret"; exit 1
          fi
          env=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$image:$stamp")
          if grep -iE 'token|secret|password' <<<"$env"; then
            echo "::error::the image's environment names a secret"; exit 1
          fi
          # Every file of the image's own filesystem (-xdev leaves out the
          # mounted /proc, /sys and /dev). It ends by printing "scan
          # finished" when find listed them all and xargs ran grep on all
          # (123: some grep found nothing, which is fine; above that, xargs
          # itself failed).
          scan=$(docker run --rm --network none "$image:$stamp" bash -c '
              find / -xdev -type f -print0 |
                xargs -0 grep -lsE "gh[opsur]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}"
              status=("${PIPESTATUS[@]}")
              [ "${status[0]}" -eq 0 ] && [ "${status[1]}" -le 123 ] && echo "scan finished"') || true
          if [ "$(tail -n1 <<<"$scan")" != "scan finished" ]; then
            echo "::error::the token scan did not finish"; echo "$scan"; exit 1
          fi
          found=$(sed '$d' <<<"$scan")
          if [ -n "$found" ]; then
            echo "::error::these files in the image hold what looks like a GitHub token:"; echo "$found"; exit 1
          fi
          echo "Secret check: no token in the image's files, history or environment"
          docker push "$image:$stamp"
          docker push "$image:f44"

  # Which image the build jobs run in: the dev image when it can be pulled
  # without credentials (it is public), by digest so one run uses one image;
  # else plain Fedora 44, where they install everything with dnf. No token is
  # sent to any registry.
  devimage:
    name: Dev image to use
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.probe.outputs.image }}
    steps:
      - name: Probe
        id: probe
        run: |
          image=ghcr.io/eternalcoder454/atlas-archive-dev
          # The digest is checked by pulling its manifest back by it.
          if digest=$(timeout 60 docker buildx imagetools inspect "$image:f44" --format '{{.Manifest.Digest}}' 2>/dev/null) &&
              [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] &&
              timeout 60 docker buildx imagetools inspect "$image@$digest" >/dev/null 2>&1; then
            echo "Using $image:f44, $digest"
            echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$image:f44 can't be pulled (not built yet, or not public): plain Fedora 44"
            echo "image=registry.fedoraproject.org/fedora:44" >> "$GITHUB_OUTPUT"
          fi

  # atlas-framework's design rules (no default buttons, no QML file named
  # like an Atlas.Ui type), at the release the crates are pinned to.
  atlas:
    name: Atlas app checks
    uses: EternalCoder454/atlas-framework/.github/workflows/app-checks.yml@b9d72940fb94178f400c3f074fe8f9744b6c6f53 # v1.6.0
    with:
      framework-ref: v1.6.0

  # Atlas.Ui (atlas-ui), which the app builds against, is in no repository:
  # atlas-framework's RPMs at the release the crates are pinned to, built
  # once per release and Fedora Qt version and cached.
  framework:
    name: atlas-framework RPMs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: registry.fedoraproject.org/fedora:44
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Tools for checkout and cache
        run: dnf -y install git-core tar zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            Cargo.toml
            .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: The release Cargo.toml pins
        id: ref
        run: |
          refs=$(grep -oE 'github\.com/EternalCoder454/atlas-framework[^}]*tag = "v[0-9]+\.[0-9]+\.[0-9]+"' Cargo.toml |
            grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          if [ "$(printf '%s\n' "$refs" | grep -c .)" != 1 ]; then
            echo "::error::Cargo.toml must pin every atlas-framework crate to one release tag (found: ${refs:-none})"; exit 1
          fi
          # The tag's commit (peeled, for an annotated tag).
          commit=$(git ls-remote https://github.com/EternalCoder454/atlas-framework "refs/tags/$refs" "refs/tags/$refs^{}" |
            sort -k2 | awk 'END { print $1 }')
          if ! [[ $commit =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::atlas-framework has no tag $refs"; exit 1
          fi
          if ! grep -qF "app-checks.yml@$commit # $refs" .github/workflows/ci.yml || ! grep -qF "framework-ref: $refs" .github/workflows/ci.yml; then
            echo "::error::the Atlas app checks job in ci.yml must use $refs: app-checks.yml@$commit # $refs and framework-ref: $refs"; exit 1
          fi
          echo "ref=$refs" >> "$GITHUB_OUTPUT"
      # atlas-ui needs the Qt minor it was built with: a Fedora Qt update
      # (today's metadata, loaded by the dnf install above) builds them again.
      - name: Fedora's Qt
        id: qt
        run: |
          qt=$(dnf -q repoquery --latest-limit=1 --qf '%{name}-%{evr}\n' qt6-qtbase qt6-qtdeclarative | sort | tr '\n' '_')
          case $qt in qt6-qtbase-*_qt6-qtdeclarative-*_) ;; *) echo "::error::could not read Fedora's Qt version ($qt)"; exit 1 ;; esac
          echo "qt=$qt" >> "$GITHUB_OUTPUT"
      - name: Cached RPMs
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out
          key: atlas-framework-rpms-f44-${{ steps.ref.outputs.ref }}-${{ steps.qt.outputs.qt }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: EternalCoder454/atlas-framework
          ref: ${{ steps.ref.outputs.ref }}
          path: atlas-framework
          persist-credentials: false
      - name: Build the RPMs
        if: steps.cache.outputs.cache-hit != 'true'
        run: atlas-framework/packaging/build-rpm.sh "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-framework-rpms
          path: out/*.rpm
          if-no-files-found: error
          retention-days: 1

  check:
    name: fmt, clippy, tests
    needs: [framework, devimage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ needs.devimage.outputs.image }}
    env:
      # No debug info: faster links and a smaller cache; tests don't need it.
      CARGO_PROFILE_DEV_DEBUG: 0
      # The C++ that cxx-qt generates for the app's own crate is rebuilt on
      # every run (rust-cache keeps only the dependencies'): ccache keeps it.
      # cc-rs takes a wrapper as the first word of CXX.
      CXX: ccache g++
      CCACHE_DIR: /github/home/.ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - name: Tools for checkout and cache
        run: rpm -q git-core tar zstd cargo rustfmt >/dev/null || dnf -y install git-core tar zstd cargo rustfmt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # First: it needs nothing built, so a formatting slip fails in seconds.
      - name: Format
        run: cargo fmt --all --check
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-framework-rpms
          # In the container: runner.temp would be the host's path.
          path: /tmp/atlas-framework-rpms
      - name: Build dependencies
        run: |
          ATLAS_LOCAL_RPMS=/tmp/atlas-framework-rpms packaging/install-builddeps.sh clippy ccache 7zip bsdtar zip unzip
          packaging/rpmfusion-nonfree.sh unrar
      # cxx-qt's build scripts compile against Qt and atlas-ui without
      # watching their versions: a cache from another toolchain is not used.
      - name: Toolchain
        id: toolchain
        run: |
          versions=$(rpm -q gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kirigami-devel atlas-ui)
          echo "hash=$(sha256sum <<<"$versions" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # The crate downloads and the dependencies' build output (not the
      # workspace's own crates), keyed on Cargo.lock and the rustc version.
      # Saved from main and beta only, so pull requests can't evict them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: f44-${{ steps.toolchain.outputs.hash }}
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      - name: Week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: ccache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /github/home/.ccache
          key: ccache-f44-${{ steps.toolchain.outputs.hash }}-${{ steps.week.outputs.week }}-${{ github.sha }}
          restore-keys: ccache-f44-${{ steps.toolchain.outputs.hash }}-
      # --locked: also fails when Cargo.lock and the atlas-framework tag disagree.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (CLI with dev-worker)
        run: cargo clippy -p atlas-archive-cli --all-targets --locked --features dev-worker -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # The CLI's integration tests point it at the test build's worker,
      # which only the dev-worker feature allows; without it they're skipped.
      - name: CLI integration tests
        run: cargo test -p atlas-archive-cli --locked --features dev-worker
      - name: ccache statistics
        if: always()
        run: ccache -s || true
      # Saved from pushes only, like rust-cache, so pull requests can't evict it.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule')
        with:
          path: /github/home/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

  # The release build, as AtlasOS builds it. Its CMake build (Corrosion's cargo
  # target in it) is cached, so it compiles only what changed.
  rpm:
    name: RPM
    needs: [framework, devimage]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: ${{ needs.devimage.outputs.image }}
    env:
      CARGO_HOME: /github/home/.cargo
      ATLAS_BUILD_CACHE: /github/home/rpm-build
    steps:
      - name: Tools for checkout and cache
        run: rpm -q git-core tar zstd >/dev/null || dnf -y install git-core tar zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-framework-rpms
          # In the container: runner.temp would be the host's path.
          path: /tmp/atlas-framework-rpms
      - name: Week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # Keyed on what the dependencies' build depends on. The week is in the
      # prefix: each week starts from nothing, so artifacts of old dependency
      # versions don't pile up (cargo never prunes its target), and a Fedora
      # toolchain update (which build-rpm.sh notices and starts over for)
      # costs one full build. Saved from pushes only, like rust-cache above.
      - name: Cached build
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /github/home/.cargo/registry
            /github/home/.cargo/git
            /github/home/rpm-build
          key: rpm-f44-${{ needs.framework.outputs.ref }}-${{ steps.week.outputs.week }}-${{ hashFiles('Cargo.lock', 'packaging/atlas-archive.spec') }}
          restore-keys: rpm-f44-${{ needs.framework.outputs.ref }}-${{ steps.week.outputs.week }}-
      - name: Build the RPM
        run: ATLAS_LOCAL_RPMS=/tmp/atlas-framework-rpms packaging/build-rpm.sh "$GITHUB_WORKSPACE/out"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: (github.event_name == 'push' || github.event_name == 'schedule') && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            /github/home/.cargo/registry
            /github/home/.cargo/git
            /github/home/rpm-build
          key: ${{ steps.cache.outputs.cache-primary-key }}
