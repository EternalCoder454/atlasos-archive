[workspace]
resolver = "3"
members = [
    "crates/atlas-archive-core",
    "crates/atlas-archive-engine",
    "apps/atlas-archive-worker",
    "apps/atlas-archive-cli",
    "apps/atlas-archive",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-archive"
rust-version = "1.89"

[workspace.dependencies]
# The atlas-framework crates (startup, settings, logging, crash reports); to
# move the pin, see CLAUDE.md. Atlas.Ui is not pinned here: it is the
# installed atlas-ui package.
atlas-framework-ui = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v1.5.1" }
log = { version = "0.4", features = ["std"] }
libc = "0.2"
encoding_rs = "0.8"
chardetng = "1.0"
zeroize = { version = "1.8", features = ["std"] }
# The worker's sandbox. Vetted: maintained by the Landlock project, MIT or
# Apache-2.0, depends only on enumflags2, libc and thiserror.
landlock = "0.4.7"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
