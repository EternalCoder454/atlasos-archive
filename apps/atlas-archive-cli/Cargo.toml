[package]
name = "atlas-archive-cli"
description = "Atlas Archive on the command line: list, extract, test, create, info"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
atlas-archive-core = { path = "../../crates/atlas-archive-core" }
log.workspace = true
libc.workspace = true
zeroize.workspace = true

[features]
# `--worker PATH`: run any executable as the worker, unsandboxed. For the
# integration tests only; never in a shipped build.
dev-worker = []

[[test]]
name = "cli"
required-features = ["dev-worker"]
