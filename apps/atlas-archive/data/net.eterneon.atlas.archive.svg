<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Atlas Archive</title>
  <!-- The Atlas apps' tile, as Atlas Store's icon has it, with a zipped box
       on it: Atlas Notes' white, lavender and purple. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7af4"/>
      <stop offset="1" stop-color="#5b4bd8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <!-- the box: lid and body -->
  <rect x="30" y="34" width="68" height="16" rx="5" fill="#ffffff"/>
  <path d="M35 54h58v34a8 8 0 0 1-8 8H43a8 8 0 0 1-8-8z" fill="#ffffff" fill-opacity="0.92"/>
  <!-- the zip down the middle -->
  <rect x="60" y="34" width="8" height="62" fill="#5b4bd8" fill-opacity="0.18"/>
  <g fill="#5b4bd8">
    <rect x="58" y="56" width="6" height="4" rx="1"/>
    <rect x="64" y="61" width="6" height="4" rx="1"/>
    <rect x="58" y="66" width="6" height="4" rx="1"/>
    <rect x="64" y="71" width="6" height="4" rx="1"/>
    <rect x="58.5" y="78" width="11" height="12" rx="3"/>
  </g>
  <rect x="61.5" y="82" width="5" height="4" rx="1.5" fill="#ffffff"/>
</svg>
