[package]
name = "telamon-archive"
description = "Telamon Archive: the archive manager of Telamon OS (Kirigami UI over CXX-Qt)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version.workspace = true
build = "build.rs"

# CMake (Corrosion) links the static library into the C++ executable.
# `rlib` is there so `cargo test` and `cargo clippy` work as usual.
[lib]
name = "telamon_archive"
crate-type = ["staticlib", "rlib"]

[dependencies]
telamon-framework-ui.workspace = true
telamon-archive-core = { path = "../../crates/telamon-archive-core" }
telamon-archive-service = { path = "../../crates/telamon-archive-service" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
log.workspace = true
zeroize.workspace = true

[dev-dependencies]
zbus = "5"
serde = "1"

[build-dependencies]
cxx-qt-build = "0.10"

[features]
# `TELAMON_ARCHIVE_WORKER=PATH`: run any executable as the worker, unsandboxed.
# For smoke tests only; never in a shipped build.
dev-worker = []
